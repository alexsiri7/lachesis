name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check mcp/

      - name: ruff format check
        run: ruff format --check mcp/

  tests:
    name: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lachesis_acceptance
        ports:
          # Not 5432, which DATABASE_URL above names for the unit tests, where nothing listens.
          - 5433:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # All settings default to "" in settings.py — stub values keep pydantic happy
      DATABASE_URL: "postgresql://postgres:test@localhost:5432/lachesis_test"
      SECRET_KEY: "ci-secret"
      GITHUB_PAT: "ghp_fake"
      GOOGLE_CLIENT_ID: "ci-client-id"
      GOOGLE_CLIENT_SECRET: "ci-client-secret"
      ALLOWED_EMAIL: "ci@example.com"
      MCP_BASE_URL: "http://localhost:8000"
      ACCEPTANCE_DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/lachesis_acceptance"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r mcp/requirements.txt

      - name: Unit tests
        working-directory: mcp
        run: pytest tests/ -x

      - name: Delivery check unit tests
        run: pytest ci

      # Strict xfail: an expected failure passes the run, an unexpected pass fails it.
      - name: Acceptance tests
        id: acceptance
        run: |
          status=0
          pytest tests/acceptance --scenario-results outcomes.json || status=$?
          echo "exit-code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      # A failing run still publishes its results; its exit code decides the conclusion.
      - name: Publish scenario results
        if: >-
          always() && steps.acceptance.outputs.exit-code != ''
          && github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.acceptance.outputs.exit-code }}
        run: |
          python ci/scenario_results.py --sha "$GITHUB_SHA" --outcomes outcomes.json \
            --exit-code "$EXIT_CODE" > check-run.json
          gh api "repos/$GITHUB_REPOSITORY/check-runs" --input check-run.json

  unsafe-change-tests:
    # The unsafe-change check itself runs from the base branch
    # (pull_request_target), so a PR changing it is only tested here.
    name: unsafe-change checker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (system python3 + PyYAML, as the check uses)
        run: python3 -m unittest discover -s .github/unsafe-change
