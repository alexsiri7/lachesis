name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check mcp/

      - name: ruff format check
        run: ruff format --check mcp/

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # All settings default to "" in settings.py — stub values keep pydantic happy
      DATABASE_URL: "postgresql://postgres:test@localhost:5432/lachesis_test"
      SECRET_KEY: "ci-secret"
      GITHUB_PAT: "ghp_fake"
      GOOGLE_CLIENT_ID: "ci-client-id"
      GOOGLE_CLIENT_SECRET: "ci-client-secret"
      ALLOWED_EMAIL: "ci@example.com"
      MCP_BASE_URL: "http://localhost:8000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r mcp/requirements.txt

      - name: Run tests
        working-directory: mcp
        run: pytest tests/ -x
