name: Delivery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Labels and the body decide whether a pull request may change acceptance tests.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

jobs:
  scenario-coverage:
    name: scenario-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Every scenario has exactly one acceptance test
        run: python ci/scenario_coverage.py

  acceptance-internals:
    name: acceptance-internals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Acceptance tests import nothing of the codebase
        run: python ci/acceptance_internals.py

  goalposts:
    name: goalposts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve merge base
        id: merge_base
        # github.event.pull_request.base.sha can lag behind the base branch's actual tip (e.g.
        # right after the PR branch merges main into itself), making a stale ancestor of HEAD
        # look like it introduced every commit since. Recompute it from the live ref instead.
        # Fail closed: an empty base would make goalposts diff nothing and pass.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          base=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")
          test -n "$base"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Implementation leaves acceptance tests alone
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.merge_base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: >-
          python ci/goalposts.py
          --base="$BASE_SHA" --head="$HEAD_SHA" --labels="$PR_LABELS" --body="$PR_BODY"

