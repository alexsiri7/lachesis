<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Lachesis{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
    <span class="font-semibold text-lg">Lachesis</span>
    {% if user_email %}
    <div class="flex items-center gap-4">
      <span class="text-sm text-gray-500">{{ user_email }}</span>
      <a href="/web/logout" class="text-sm text-red-500 hover:underline">Logout</a>
    </div>
    {% endif %}
  </nav>
  <main class="px-6 py-8 max-w-4xl mx-auto">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
